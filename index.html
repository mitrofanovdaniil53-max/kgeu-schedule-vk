<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>КГЭУ — перенос приложения</title>
  <style>
    body{font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:24px;display:grid;min-height:100vh;place-items:center;box-sizing:border-box;background:#f4f6fa;color:#172033}
    main{max-width:480px;padding:24px;border:1px solid #dce2ec;border-radius:20px;background:white}
    a{color:#2459c4}
  </style>
</head>
<body>
  <main>
    <h1>Приложение переезжает</h1>
    <p>Открываю новую версию КГЭУ. Если переход не сработал, нажми на ссылку ниже.</p>
    <p><a id="new-app-link" href="https://mitrofanovdaniil53-max.github.io/kgeu-telegram-miniapp/apps/vk/">Открыть VK-версию расписания</a></p>
  </main>
  <script>
    (function () {
      var base = 'https://mitrofanovdaniil53-max.github.io/kgeu-telegram-miniapp/apps/vk/';
      var target = base + window.location.search + window.location.hash;
      document.getElementById('new-app-link').href = target;
      window.location.replace(target);
    })();
  </script>
</body>
</html>
